<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | إنجاز نافس</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-auth">
  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="logo"><span class="logo__mark">إن</span><span>إنجاز نافس</span></a>
      <a href="index.html" class="nav__back">→ الرئيسية</a>
    </div>
  </header>

  <main class="auth">
    <div class="auth__card">
      <h1>تسجيل الدخول</h1>
      <p class="auth__sub">أهلاً بعودتك! أدخل بياناتك للوصول إلى لوحة التحكم.</p>
      <div id="setupNotice"></div>
      <form class="form form--flat" id="loginForm" novalidate>
        <label>البريد الإلكتروني أو اسم المستخدم<input type="text" name="email" required autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr"></label>
        <label>كلمة المرور<input type="password" name="password" required autocomplete="current-password" dir="ltr"></label>
        <button type="submit" class="btn btn--primary btn--block">دخول</button>
        <button type="button" class="link-btn" id="resetBtn">نسيت كلمة المرور؟</button>
        <p class="form__msg" id="msg" role="status" aria-live="polite"></p>
      </form>
      <p class="auth__alt">ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a></p>
    </div>
  </main>

  <script type="module">
    import { configured, auth, A, onUser, errorText, toLoginEmail } from './js/fb.js';
    import { setMsg, notConfiguredBox } from './js/ui.js';

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    if (!configured) {
      document.getElementById('setupNotice').append(notConfiguredBox());
      form.querySelectorAll('input, button').forEach(x => { x.disabled = true; });
    } else {
      onUser(u => { if (u && u.hasProfile) location.replace('dashboard.html'); });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const email = form.email.value.trim(), password = form.password.value;
        if (!email || !password) return setMsg(msg, 'أدخل البريد الإلكتروني (أو اسم المستخدم) وكلمة المرور.', 'err');
        const btn = form.querySelector('[type=submit]');
        btn.disabled = true;
        setMsg(msg, 'جارٍ تسجيل الدخول…');
        try {
          await A.signInWithEmailAndPassword(auth, toLoginEmail(email), password);
          location.replace('dashboard.html');
        } catch (err) {
          setMsg(msg, errorText(err), 'err');
          btn.disabled = false;
        }
      });

      document.getElementById('resetBtn').addEventListener('click', async () => {
        const email = form.email.value.trim();
        if (!email) return setMsg(msg, 'اكتب بريدك الإلكتروني أولاً ثم اضغط «نسيت كلمة المرور».', 'err');
        if (!email.includes('@')) return setMsg(msg, 'حسابك أنشأته مدرستك. اطلب منها بيانات الدخول من لوحة المدرسة.', 'err');
        try {
          await A.sendPasswordResetEmail(auth, email);
          setMsg(msg, 'إذا كان البريد مسجّلاً فستصلك رسالة لإعادة تعيين كلمة المرور.', 'ok');
        } catch (err) {
          setMsg(msg, errorText(err), 'err');
        }
      });
    }
  </script>
</body>
</html>
